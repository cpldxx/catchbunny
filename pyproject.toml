[project]
name = "catchbunny"
version = "0.1.0"
description = "Autonomous QA swarm: parallel browser agents that map a web app, hunt bugs, and prove every finding by deterministic replay."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "anthropic>=1.0",
    "cryptography>=43",
    "fastapi>=0.115",
    "httpx>=0.27",
    "mcp>=1.2",
    "playwright>=1.49",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "uvicorn>=0.32",
]

[project.scripts]
catchbunny = "catchbunny.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "python-multipart>=0.0.33",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catchbunny"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
