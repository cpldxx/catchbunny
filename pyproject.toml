[project]
name = "catchbunny"
version = "0.1.0"
description = "Autonomous QA swarm: parallel browser agents that map a web app, hunt bugs, and prove every finding by deterministic replay."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "anthropic>=2.8",
    "cryptography>=43",
    "fastapi>=0.115",
    "httpx>=0.27",
    "mcp>=2.3",
    "playwright>=1.65",
    "pydantic>=2.9",
    "python-multipart>=0.0.33",  # form posts: the demo shop, and the OAuth token endpoint of a team server
    "pyyaml>=6.0",
    "uvicorn>=0.32",
]

[project.scripts]
catchbunny = "catchbunny.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catchbunny"]

# The console, the landing page and the docs, built. They are committed in web/dist so that
# `uv tool install git+https://...` needs no Node; rebuild with (cd web && npm run build) and commit.
[tool.hatch.build.targets.wheel.force-include]
"web/dist" = "catchbunny/web"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
